[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM[7]
lib_ldf_mode = deep+
lib_deps = 
	adafruit/Adafruit MLX90640@^1.0.2
	adafruit/Adafruit BusIO@^1.9.3
 	bodmer/TFT_eSPI